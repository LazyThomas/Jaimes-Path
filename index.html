<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a92136"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jaime's Path"><title>Jaime's Path</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#44222a;background:#fff6f5}*{box-sizing:border-box}body{margin:0;padding-bottom:92px}header{background:#a92136;color:white;padding:16px 18px;display:flex;align-items:center;gap:13px}header strong{font-size:20px}header small{display:block;font-size:12px;opacity:.9}.bug{font-size:40px}main{max-width:650px;margin:auto;padding:16px}h1{font-size:25px;margin:7px 0 14px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.5}.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 17px #43142220}.muted{color:#80626a;font-size:13px}.big{font-size:38px;font-weight:750}.bar{height:12px;background:#f6e4e7;border-radius:99px;overflow:hidden;margin:8px 0 13px}.bar i{display:block;height:100%;background:#d84d61;border-radius:99px}.macro{display:flex;justify-content:space-between;margin-top:12px}.macro b{font-weight:650}button{font:inherit;border:0;border-radius:12px;cursor:pointer;padding:12px 14px;min-height:45px;background:#ffe7e9;color:#84263a;font-weight:600}.primary{background:#b5263d;color:white}.red{color:#b23d37}button:disabled{opacity:.55}.full{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.buttons button{flex:1}input,select,textarea{display:block;width:100%;font:inherit;padding:12px;border:1px solid #e5b9bf;border-radius:10px;background:white;color:#42232b;margin:6px 0 14px}label{font-size:14px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry{border-bottom:1px solid #f5dce1;padding:12px 0}.entry:last-child{border:0}.entry small{display:block;color:#80626a;margin-top:4px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0cbd1;display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:3}nav button{font-size:12px;background:transparent;padding:5px;min-height:48px}nav button.active{color:#a92136;background:#ffe8ec}dialog{width:min(94vw,510px);max-height:85vh;border:0;border-radius:18px;padding:20px;box-shadow:0 20px 70px #27050f80}dialog::backdrop{background:#19060980}dialog h2{margin-bottom:16px}svg{max-width:100%}.notice{background:#fff0e9;padding:12px;border-radius:10px;font-size:13px}.empty{color:#90717a;text-align:center;padding:15px}body.dark{background:#241719;color:#fff0ef}body.dark .card,body.dark nav,body.dark dialog{background:#3a2428;color:#fff0ef}body.dark input,body.dark select{background:#301b20;color:white}
</style></head><body><header><span class="bug">🐞</span><div><strong>Jaime's Path</strong><small>Every Step Counts.</small></div></header><main id="app"></main><nav id="nav"><button data-page="today">⌂<br>Today</button><button data-page="diary">☷<br>Food Diary</button><button data-page="weight">⌁<br>Weight</button><button data-page="settings">⚙<br>Settings</button></nav><dialog id="dlg"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><button onclick="document.getElementById('dlg').close()" class="full">Close</button></dialog>
<script>
'use strict';
const K='jaimes-path-local-v1',defaults={cal:1800,p:120,c:180,f:60,start:null,goal:null},today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let data;try{data=JSON.parse(localStorage.getItem(K))||{foods:[],weights:[],goals:defaults}}catch{data={foods:[],weights:[],goals:defaults}}data.goals={...defaults,...data.goals};
let page='today',date=today(),range='30';
const $=id=>document.getElementById(id),fmt=v=>Math.round(Number(v)*10)/10,uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random(),save=()=>localStorage.setItem(K,JSON.stringify(data));
const safe=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[ch]));
const fields=(n,v='',type='number')=>'<label>'+n+'<input id="'+n+'" type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+safe(v??'')+'"></label>';
const maybe=x=>x===''||x==null?null:Number(x),foodDay=()=>data.foods.filter(x=>x.date===date);
function totals(){const list=foodDay();return{cal:list.reduce((s,x)=>s+x.cal,0),p:list.reduce((s,x)=>s+(x.p||0),0),c:list.reduce((s,x)=>s+(x.c||0),0),f:list.reduce((s,x)=>s+(x.f||0),0),incomplete:list.some(x=>x.p===null||x.c===null||x.f===null)}}
function bar(v,g){return '<div class="bar"><i style="width:'+Math.min(100,100*v/(g||1))+'%"></i></div>'}
function macro(name,val,g){return '<div class="macro"><b>'+name+'</b><span>'+fmt(val)+' / '+g+' g</span></div>'+bar(val,g)}
const lastWeight=()=>[...data.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];
function show(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
function render(){let t=totals(),g=data.goals,html='';
if(page==='today'){let h=new Date().getHours(),w=lastWeight();html='<h1>Good '+(h<12?'morning':h<17?'afternoon':'evening')+', Jaime! 🌿</h1><section class="card"><h2>Today’s Calories</h2><div class="big">'+fmt(t.cal)+' <small class="muted">eaten</small></div>'+bar(t.cal,g.cal)+'<div class="row"><span>Goal: '+g.cal+'</span><b>Remaining: '+fmt(g.cal-t.cal)+'</b></div></section><button class="primary full" onclick="addFood()">＋ Log Food</button><section class="card" style="margin-top:14px"><h2>Daily Macros</h2>'+macro('Protein',t.p,g.p)+macro('Carbs',t.c,g.c)+macro('Fat',t.f,g.f)+(t.incomplete?'<p class="notice">Some meals have unknown macros. Totals show recorded grams only.</p>':'')+'</section><section class="card"><h2>Weight Progress</h2><div class="big">'+(w?fmt(w.value)+' lb':'—')+'</div><p class="muted">Latest measurement · Goal: '+(g.goal??'not set')+' lb</p><button onclick="show(\'weight\')">View Weight History</button></section>';}
if(page==='diary'){html='<h1>Food Diary</h1><section class="card"><div class="row"><button onclick="changeDate(-1)">‹</button><input style="width:65%;margin:0" id="date" type="date" value="'+date+'" onchange="date=this.value;render()"><button onclick="changeDate(1)">›</button></div><p><b>'+fmt(t.cal)+' calories</b> recorded</p><button class="primary full" onclick="addFood()">＋ Log Food</button></section>';for(let group of ['Breakfast','Lunch','Dinner','Snacks']){let foods=foodDay().filter(x=>x.meal===group);html+='<section class="card"><h2>'+group+'</h2>'+(foods.map(x=>'<div class="entry"><div class="row"><b>'+safe(x.name)+'</b><span>'+fmt(x.cal)+' cal</span></div><small>Protein '+(x.p??'?')+'g · Carbs '+(x.c??'?')+'g · Fat '+(x.f??'?')+'g</small><div class="buttons"><button onclick="foodForm(\''+x.id+'\')">Edit</button><button onclick="duplicate(\''+x.id+'\')">Repeat</button><button class="red" onclick="deleteFood(\''+x.id+'\')">Delete</button></div></div>').join('')||'<p class="empty">No entries</p>')+'</section>'}}
if(page==='weight'){html='<h1>Weight History</h1><section class="card"><h2>Weight Progress</h2><div class="row"><span>Starting: '+(g.start??'—')+' lb</span><span>Goal: '+(g.goal??'—')+' lb</span></div><p>Latest: <b>'+(lastWeight()?.value??'—')+' lb</b></p><div class="buttons">'+[['7','7d'],['30','30d'],['90','90d'],['180','6m'],['365','1y'],['all','All']].map(x=>'<button '+(range===x[0]?'class="primary"':'')+' onclick="range=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>'+graph()+'<button class="primary full" onclick="weightForm()">＋ Record Weight</button></section><section class="card"><h2>Measurements</h2>'+[...data.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<div class="entry row"><span>'+safe(x.date)+'</span><b>'+x.value+' lb</b><button onclick="weightForm(\''+x.id+'\')">Edit</button></div>').join('')+'</section>'}
if(page==='settings'){html='<h1>Settings</h1><section class="card"><h2>Daily Goals</h2><form id="goalform">'+fields('Calories',g.cal)+fields('Protein',g.p)+fields('Carbs',g.c)+fields('Fat',g.f)+fields('StartWeight',g.start)+fields('GoalWeight',g.goal)+'<button class="primary full">Save Goals</button></form></section><section class="card"><h2>Data & Backup</h2><p class="notice">Records are local to this browser. They do not sync to Jaime’s phone. Export a backup before clearing this device.</p><button onclick="backup()" class="full">Export JSON Backup</button><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"><button class="red full" onclick="clearData()">Clear Local Data</button></section><section class="card"><h2>AI Photo Recognition</h2><p class="notice">Camera and photo selection are available. AI estimates require a separate secure backend (see README). Without one, use the photo as a visual reference while entering macros manually. Never paste an AI provider API key here.</p><label>Photo analysis service URL<input type="url" id="photoApi" placeholder="https://your-worker.example.workers.dev/analyze" value="'+safe(localStorage.getItem('jaime-photo-endpoint')||'')+'"></label><button onclick="savePhotoEndpoint()" class="full">Save Service URL</button></section>'}
$('app').innerHTML=html;if(page==='settings')$('goalform').onsubmit=e=>{e.preventDefault();for(const [k,id] of Object.entries({cal:'Calories',p:'Protein',c:'Carbs',f:'Fat',start:'StartWeight',goal:'GoalWeight'})){const v=maybe($(id).value);if(v!==null&&(!Number.isFinite(v)||v<0)){alert('Invalid '+id);return}data.goals[k]=v}save();render()}}
function changeDate(n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');render()}
function modal(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dlg').showModal()}
function addFood(){modal('Log Food','<button class="primary full" onclick="photoCapture()">📷 Take Food Photo</button><br><br><button class="full" onclick="foodForm()">Enter Calories / Macros</button><br><br><button class="full" onclick="barcode()">Find by Barcode Number</button>')}

function savePhotoEndpoint(){const s=$('photoApi').value.trim();if(s&&!/^https:\/\/[a-z0-9.-]+(?:\:[0-9]+)?\/[a-z0-9/_-]*$/i.test(s)){alert('Use an HTTPS URL to a trusted photo analysis endpoint');return}localStorage.setItem('jaime-photo-endpoint',s);const code=$('photoCode')?.value||'';if(code)sessionStorage.setItem('jaime-photo-session-code',code);alert('URL saved. Session access code is stored only until this browser session ends.')}
function photoCapture(){
modal('Photograph Your Food','<p class="muted">Choose camera or a photo. You can review the image before submitting it for analysis.</p><label class="primary" style="display:block;text-align:center;padding:15px;border-radius:12px;color:#fff">📷 Open Camera<input aria-label="Capture meal photograph" type="file" accept="image/*" capture="environment" style="display:none" onchange="photoSelected(this.files[0])"></label><br><label style="display:block;text-align:center;padding:15px;border-radius:12px;background:#ffe7e9">🖼️ Choose from Photos<input aria-label="Choose meal photograph" type="file" accept="image/*" style="display:none" onchange="photoSelected(this.files[0])"></label>');
}
let selectedPhoto=null,selectedPhotoUrl=null;
async function photoSelected(file){
if(!file)return;
if(!file.type.startsWith('image/')){alert('Select an image');return}
if(file.size>18*1024*1024){alert('Image is too large (18 MB maximum). Select a smaller photo.');return}
selectedPhoto=file;
if(selectedPhotoUrl)URL.revokeObjectURL(selectedPhotoUrl);
selectedPhotoUrl=URL.createObjectURL(file);
const preview=document.createElement('img');preview.src=selectedPhotoUrl;preview.alt='Selected meal photograph';preview.style='max-width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin:10px 0';
modal('Review Meal Photo','<p class="muted">Photo-based nutrition is an estimate, not an exact measurement. Hidden oils, sauces and portion sizes can affect accuracy.</p><div id="photoPreview"></div><button id="analyzePhoto" class="primary full" onclick="analyzeSelectedPhoto()">Analyze Photo</button><p id="photoStatus" class="notice">A secure AI service is needed for automatic recognition.</p><button class="full" onclick="foodForm()">Enter Meal Manually Instead</button>');
$('photoPreview').append(preview);
}
async function photoDataUrl(file){
const bmp=await createImageBitmap(file),scale=Math.min(1,1200/Math.max(bmp.width,bmp.height));
const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close?.();return canvas.toDataURL('image/jpeg',0.76);
}
async function analyzeSelectedPhoto(){
const endpoint=localStorage.getItem('jaime-photo-endpoint')||'';
if(!endpoint){$('photoStatus').textContent='Camera works. To calculate macros automatically, first configure the secure AI analysis service in Settings. You can still enter the photographed meal manually.';return}
if(!selectedPhoto){alert('Please choose a food photograph first');return}
const btn=$('analyzePhoto');btn.disabled=true;$('photoStatus').textContent='Analyzing meal...';
try{
const image=await photoDataUrl(selectedPhoto);
const code=sessionStorage.getItem('jaime-photo-session-code');if(!code)throw Error('Set the private photo access code in Settings first');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+code},body:JSON.stringify({image})});
if(!response.ok)throw new Error(response.status===429?'Service busy or usage limit reached':response.status===401?'Service authorization required':'Analysis unavailable ('+response.status+')');
const result=await response.json();
if(!Array.isArray(result.foods)||!result.foods.length)throw Error('No food detected');
const foods=result.foods.filter(f=>f&&typeof f.name==='string'&&[f.calories,f.protein,f.carbs,f.fat].every(v=>typeof v==='number'&&Number.isFinite(v)&&v>=0));
if(!foods.length)throw Error('Could not confirm nutrition values');
const total=foods.reduce((o,f)=>({cal:o.cal+f.calories,p:o.p+f.protein,c:o.c+f.carbs,f:o.f+f.fat}),{cal:0,p:0,c:0,f:0});
selectedPhoto=null;if(selectedPhotoUrl){URL.revokeObjectURL(selectedPhotoUrl);selectedPhotoUrl=null}
foodForm();
$('FoodName').value=foods.map(f=>f.name).join(', ');
$('Calories').value=Math.round(total.cal);
$('Protein').value=fmt(total.p);$('Carbs').value=fmt(total.c);$('Fat').value=fmt(total.f);
const info=document.createElement('p');info.className='notice';info.textContent='AI ESTIMATE — '+foods.map(f=>f.name).join(', ')+'. Review portions, hidden oils, sauces and all numbers before saving. No entry is saved until you tap Save Food.';
$('foodForm').prepend(info);
}catch(e){const status=$('photoStatus');if(status)status.textContent='Analysis failed: '+e.message+'. You can enter the meal manually.';if(btn)btn.disabled=false}
}
function foodForm(id){const f=id?data.foods.find(x=>x.id===id):null;modal(f?'Edit Food':'Enter Food','<form id="foodForm">'+fields('FoodName',f?.name||'','text')+'<label>Meal<select id="Meal">'+['Breakfast','Lunch','Dinner','Snacks'].map(m=>'<option '+(m===f?.meal?'selected':'')+'>'+m+'</option>').join('')+'</select></label>'+fields('Calories',f?.cal??'')+fields('Protein',f?.p??'')+fields('Carbs',f?.c??'')+fields('Fat',f?.f??'')+'<p id="estimate" class="muted">Enter all three macros to calculate calories</p><label>Date<input type="date" id="FoodDate" value="'+(f?.date||date)+'"></label><button class="primary full">Save Food</button></form>');for(let x of ['Protein','Carbs','Fat'])$(x).oninput=()=>{let [p,c,f]=['Protein','Carbs','Fat'].map(id=>maybe($(id).value));$('estimate').textContent=[p,c,f].every(x=>x!==null)?'Estimated calories from macros: '+fmt(p*4+c*4+f*9):'Enter all three macros for calculated calories'};$('foodForm').onsubmit=e=>{e.preventDefault();let [p,c,f]=['Protein','Carbs','Fat'].map(id=>maybe($(id).value)),cal=maybe($('Calories').value);if(cal===null&&[p,c,f].every(x=>x!==null))cal=p*4+c*4+f*9;if(cal===null||![cal,p??0,c??0,f??0].every(Number.isFinite)||cal<0){alert('Enter valid calories or all macros');return}const obj={id:id||uid(),date:$('FoodDate').value||date,meal:$('Meal').value,name:$('FoodName').value.trim()||'Food',cal,p,c,f};if(id)data.foods=data.foods.filter(x=>x.id!==id);data.foods.push(obj);save();$('dlg').close();render()}}
function deleteFood(id){if(confirm('Delete food entry?')){data.foods=data.foods.filter(x=>x.id!==id);save();render()}}
function duplicate(id){const f=data.foods.find(x=>x.id===id);data.foods.push({...f,id:uid(),date});save();render()}
function weightForm(id){const w=id?data.weights.find(x=>x.id===id):null;modal('Record Weight','<form id="weightForm">'+fields('Weight',w?.value??'')+'<label>Date<input type="date" id="WeightDate" value="'+(w?.date||today())+'"></label><label>Note<input id="WeightNote" value="'+safe(w?.note||'')+'"></label><button class="primary full">Save Weigh-In</button></form>'+(id?'<button onclick="deleteWeight(\''+id+'\')" class="red full">Delete Measurement</button>':''));$('weightForm').onsubmit=e=>{e.preventDefault();const value=Number($('Weight').value);if(!Number.isFinite(value)||value<=0){alert('Enter valid weight');return}data.weights=data.weights.filter(x=>x.id!==id);data.weights.push({id:id||uid(),value,date:$('WeightDate').value,note:$('WeightNote').value});save();$('dlg').close();render()}}
function deleteWeight(id){if(confirm('Delete measurement?')){data.weights=data.weights.filter(x=>x.id!==id);save();$('dlg').close();render()}}
function graph(){const cutoff=range==='all'?'0000-00-00':(()=>{const d=new Date();d.setDate(d.getDate()-Number(range)+1);return d.toISOString().slice(0,10)})();const pts=[...data.weights].filter(x=>x.date>=cutoff).sort((a,b)=>a.date.localeCompare(b.date));if(!pts.length)return '<p class="empty">No measurements in this period</p>';const min=Math.min(...pts.map(p=>p.value))-2,max=Math.max(...pts.map(p=>p.value))+2;const time=pts.map(p=>Date.parse(p.date+'T12:00:00')),first=Math.min(...time),last=Math.max(...time),coords=pts.map((p,i)=>[20+340*(last===first?.5:(time[i]-first)/(last-first)),145-125*(p.value-min)/(max-min)]);return '<svg role="img" aria-label="Weight history graph" viewBox="0 0 380 180"><path d="M20 20V145H365" stroke="#ddb4bc" fill="none"/><polyline fill="none" stroke="#bf2d46" stroke-width="3" points="'+coords.map(c=>c.join(',')).join(' ')+'"/>'+coords.map((c,i)=>'<circle cx="'+c[0]+'" cy="'+c[1]+'" r="4" fill="#a92136"><title>'+pts[i].date+': '+pts[i].value+' lb</title></circle>').join('')+'<text x="22" y="13" font-size="12" fill="#a92136">'+fmt(max-2)+' lb</text><text x="22" y="165" font-size="12" fill="#a92136">'+fmt(min+2)+' lb</text></svg>'}
async function barcode(){modal('Barcode Lookup','<p class="notice">This version supports typing a barcode number, not camera scanning.</p><input id="barcodeInput" placeholder="8–14 digit EAN / UPC" inputmode="numeric"><button class="primary full" id="lookup">Search Open Food Facts</button><p id="lookupStatus"></p>');$('lookup').onclick=async()=>{let code=$('barcodeInput').value.replace(/\D/g,'');if(!/^\d{8,14}$/.test(code))return alert('Invalid barcode');$('lookupStatus').textContent='Searching...';try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json');if(!r.ok)throw Error('Lookup unavailable');const j=await r.json();if(j.status!==1)throw Error('Not found');const n=j.product.nutriments||{},cal=n['energy-kcal_serving']??n['energy-kcal_100g'];if(cal==null)throw Error('No nutrition value');const name=j.product.product_name||'Packaged food';$('dlg').close();foodForm();$('FoodName').value=name;$('Calories').value=cal;$('Protein').value=n.proteins_serving??n.proteins_100g??'';$('Carbs').value=n.carbohydrates_serving??n.carbohydrates_100g??'';$('Fat').value=n.fat_serving??n.fat_100g??'';alert(n['energy-kcal_serving']!=null?'Review nutrition per serving before saving.':'Nutrition is per 100g. Adjust for portion before saving.')}catch(e){$('lookupStatus').textContent=e.message+'; use manual entry.'}}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'jaime-v1',data},null,2)],{type:'application/json'}));a.download='jaimes-path-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function restore(f){if(!f)return;try{const x=JSON.parse(await f.text());if(x.format!=='jaime-v1'||!Array.isArray(x.data.foods)||!Array.isArray(x.data.weights))throw Error('Invalid backup');if(!confirm('Replace ALL local records with this backup?'))return;data=x.data;data.goals={...defaults,...data.goals};save();render()}catch(e){alert('Import failed: '+e.message)}}
function clearData(){if(confirm('Delete ALL local food and weight records? Export a backup first.')){data={foods:[],weights:[],goals:defaults};save();render()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('today');
</script></body></html>
